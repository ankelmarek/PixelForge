name: PixelForge checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pixelforge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install PHP ZIP support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-zip libnss3-tools
          php -v
          php -r 'exit(class_exists("ZipArchive") ? 0 : 1);'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - name: PHP syntax
        run: find admin-updater tests/updater -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm test
      - run: npm run build
      - name: Verify unchanged static game
        if: github.head_ref == 'feature/p2-u2-admin-panel'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('downloads/pixelforge-0.6.1-full.zip') as archive:
              expected = {name: archive.read(name) for name in archive.namelist() if name != 'manifest.json'}
          actual = {path.relative_to('dist').as_posix(): path.read_bytes() for path in Path('dist').rglob('*') if path.is_file()}
          assert actual == expected, 'Static build changed during the updater stage'
          print(f'{len(actual)} static files match the accepted 0.6.1 release byte for byte')
          PY
      - run: npm run test:e2e
      - run: npm run test:updater:browser
      - run: npm run test:panel:browser
      - run: npm run package:release
      - run: npm run test:game:browser
      - run: npm run test:release:browser
      - run: npm run package:updater
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixelforge-checks
          path: |
            test-results/
            playwright-report/
            downloads/pixelforge-updater-*.zip
            downloads/pixelforge-updater-*.sha256
            downloads/pixelforge-0.7.0-full.zip
            downloads/pixelforge-0.7.0-full.zip.sha256
          if-no-files-found: ignore
          retention-days: 14
