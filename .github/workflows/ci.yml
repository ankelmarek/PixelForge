name: PixelForge checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pixelforge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install PHP ZIP support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-zip
          php -v
          php -r 'exit(class_exists("ZipArchive") ? 0 : 1);'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - name: PHP syntax
        run: find admin-updater tests/updater -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:updater:browser
      - run: npm run package:updater
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixelforge-checks
          path: |
            test-results/
            playwright-report/
            downloads/pixelforge-updater-*.zip
            downloads/pixelforge-updater-*.sha256
          if-no-files-found: ignore
          retention-days: 14
