name: PixelForge checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pixelforge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install PHP ZIP support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-zip libnss3-tools
          php -v
          php -r 'exit(class_exists("ZipArchive") ? 0 : 1);'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
        id: lint
        continue-on-error: true
      - name: Formatting suggestions
        if: steps.lint.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import json, subprocess
          paths = subprocess.run(['npx', 'prettier', '--list-different', '.'], capture_output=True, text=True).stdout.splitlines()
          for path in paths:
              result = subprocess.run(['npx', 'prettier', path], capture_output=True, text=True, check=True)
              print('PF_FORMAT ' + json.dumps({'path': path, 'content': result.stdout}))
          PY
      - run: npm run typecheck
      - name: PHP syntax
        run: find admin-updater tests/updater -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:updater:browser
      - run: npm run test:panel:browser
      - run: npm run package:updater
      - name: Export review artifacts
        run: |
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          paths = [
              'downloads/pixelforge-updater-u2-1.1.0.zip',
              'downloads/pixelforge-updater-u2-1.1.0.zip.sha256',
              'test-results/U2-BROWSER-RESULTS.json',
              'test-results/u2-desktop.png',
              'test-results/u2-mobile.png',
          ]
          for name in paths:
              data = Path(name).read_bytes()
              encoded = base64.b64encode(data).decode()
              chunks = [encoded[i:i+4096] for i in range(0, len(encoded), 4096)]
              print('PF_ARTIFACT_META ' + json.dumps(dict(name=name, sha256=hashlib.sha256(data).hexdigest(), bytes=len(data), parts=len(chunks))))
              for part, chunk in enumerate(chunks):
                  print('PF_ARTIFACT ' + json.dumps(dict(name=name, part=part, data=chunk)))
          PY
      - name: Require lint success
        if: always() && steps.lint.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixelforge-checks
          path: |
            test-results/
            playwright-report/
            downloads/pixelforge-updater-*.zip
            downloads/pixelforge-updater-*.sha256
          if-no-files-found: ignore
          retention-days: 14
